<meta name="theme-color" content="#C9B6EF">
<meta name="color-scheme" content="light">
<title>¿Ha comido? · Nexa3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&display=swap" rel="stylesheet">
<style>
  /* Estilo «Sello»: fondo del color del filamento, tinta violeta, tarjetas blancas con borde y sombra dura.
     Tema claro fijo a propósito: la pantalla es la continuación del objeto, no del sistema. */
  :root {
    color-scheme: light;
    --suelo: #C9B6EF;        /* lo cambia cada pieza (tema elegido) */
    --surface: #FFFFFF;
    --ink: #2A1F3D;
    --muted: #4A3F5C;        /* sobre el suelo: contraste ≥ 4,5:1 en todos los temas */
    --muted-on-white: #5C506E;
    --soft: #F3EFF8;
    --amarillo: #F4C430;
    --verde: #3F8F3A;
    --azul: #86BCE6;
    --azul-ink: #2F6FB0;
    --rojo: #C8262E;
    --danger: #B3261E;
    --borde: 2.5px solid var(--ink);
    --sombra: 4px 5px 0 var(--ink);
    --r-lg: 22px;
    --r-md: 14px;
    --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --text: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --legible: "Atkinson Hyperlegible", system-ui, sans-serif;   /* contraseñas y PIN: distingue 0/O y l/I/1 */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--suelo); }
  body {
    color: var(--ink);
    font-family: var(--text);
    font-size: 17px;
    font-weight: 500;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    transition: background-color .4s ease;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
  h1, h2, h3 { text-wrap: balance; }

  main {
    max-width: 460px;
    margin: 0 auto;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; display: flex; flex-direction: column; }

  /* Rótulos: Bricolage estrecha y negra; «pegatina» = blanco con contorno y sombra de tinta */
  .titular { font-family: var(--display); font-weight: 800; font-stretch: 75%; }
  .pegatina {
    font-family: var(--display); font-weight: 800; font-stretch: 75%;
    color: #FFFFFF; -webkit-text-stroke: .068em var(--ink); paint-order: stroke fill;
    text-shadow: .045em .055em 0 var(--ink);
    line-height: 1.02; margin: 0; overflow-wrap: anywhere;
  }

  /* ——— Barra superior ——— */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .top-label { font-weight: 700; font-size: 16px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px;
    border: var(--borde); background: var(--surface); color: var(--ink);
    display: grid; place-items: center; flex: none;
    transition: background-color .15s ease, transform .08s ease;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ——— Botones ——— */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 62px; padding: 14px 22px;
    border: var(--borde); border-radius: 20px;
    background: var(--ink); color: #FFFFFF;
    font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 22px; line-height: 1.15;
    text-decoration: none; text-align: center;
    box-shadow: 0 5px 0 #000000;
    transition: background-color .15s ease, transform .08s ease, box-shadow .08s ease;
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.sec { background: var(--surface); color: var(--ink); box-shadow: none; font-weight: 700; font-stretch: 100%; font-size: 18px; min-height: 56px; }
  .btn.azul { background: var(--azul); color: var(--ink); box-shadow: 0 5px 0 var(--ink); }
  .btn.rojo { background: var(--rojo); color: #FFFFFF; box-shadow: 0 5px 0 var(--ink); }
  .btn.small { min-height: 50px; font-size: 17px; padding: 10px 16px; box-shadow: none; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 2px 0 #000000; }
  .btn.sec:active:not([disabled]), .btn.small:active:not([disabled]) { transform: translateY(2px); box-shadow: none; }
  .icon-btn:active, .chip:active, .who-list button:active, .tema:active { transform: scale(.96); }

  .link {
    background: none; border: 0; padding: 10px 2px; color: var(--ink);
    font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 4px;
    text-decoration-thickness: 2px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; align-self: center;
    background: var(--surface); border: var(--borde); border-radius: 999px;
    padding: 8px 16px; font-weight: 700; font-size: 15px; color: var(--ink);
    transition: background-color .15s ease, transform .08s ease;
  }
  .chip svg { width: 16px; height: 16px; }

  /* Solo en ordenador (ratón): el hover nunca cambia el color del texto */
  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not([disabled]) { background: #000000; }
    .btn.sec:hover:not([disabled]), .icon-btn:hover, .chip:hover, .who-list button:hover { background: var(--soft); }
    .btn.azul:hover:not([disabled]) { background: #6EAEDF; }
    .btn.rojo:hover:not([disabled]) { background: #A91F26; }
    .link:hover { text-decoration-thickness: 3px; }
  }

  /* ——— Tarjetas ——— */
  .card { background: var(--surface); border: var(--borde); border-radius: var(--r-lg); box-shadow: var(--sombra); padding: 18px 20px 20px; }

  /* ——— ¿Ha comido? ——— */
  .pet-name { text-align: center; margin: 12px 0 0; overflow-wrap: normal; word-break: keep-all; hyphens: none; }
  .bol { display: flex; justify-content: center; margin: 12px 0 0; }
  .bol svg { display: block; width: min(72vw, 280px); height: auto; overflow: visible; }
  .bol.pop .comida { animation: caer .5s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes caer { from { transform: translateY(-26px); opacity: 0; } }
  .status { margin-top: 14px; }
  .status-title { font-size: 36px; line-height: 1; margin: 0; }
  .status-detail { margin: 6px 0 0; font-size: 17px; }
  .barra { margin-top: 16px; height: 22px; border: var(--borde); border-radius: 999px; overflow: hidden; background: var(--soft); }
  .barra-fill { height: 100%; border-right: var(--borde); background: var(--amarillo); transition: width .8s ease; }
  .barra-fill.lleno { border-right: 0; }
  .state-fed .barra-fill { background: #9CCB8B; }
  .status.aviso { background: #9CCB8B; }
  .status.aviso.sobre-verde { background: var(--surface); }
  .status-cuando { margin: 10px 0 0; font-size: 19px; font-weight: 800; }
  .status.aviso .status-detail { font-size: 15px; font-weight: 600; margin-top: 4px; }
  .state-hungry .bol svg { animation: pedir 3.2s ease-in-out infinite; transform-origin: 50% 85%; }
  @keyframes pedir { 0%, 78%, 100% { transform: rotate(0); } 82% { transform: rotate(-3deg); } 87% { transform: rotate(3deg); } 92% { transform: rotate(-2deg); } 96% { transform: rotate(1deg); } }
  .barra-txt { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 15px; font-weight: 600; }
  .actions { display: grid; gap: 12px; margin-top: 22px; }
  .actions .chip { justify-self: center; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .foot-me { font-size: 15px; font-weight: 600; }

  .who-title { font-size: 44px; margin: 22px 0 6px; }
  .who-list { display: grid; gap: 12px; margin-top: 20px; }
  .who-list button {
    text-align: left; padding: 16px 20px; border-radius: 18px;
    border: var(--borde); background: var(--surface); box-shadow: var(--sombra);
    font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px;
    display: flex; justify-content: space-between; align-items: center;
    transition: background-color .15s ease, transform .08s ease;
  }
  .who-list button svg { width: 22px; height: 22px; }

  .confirm { background: var(--surface); border: var(--borde); border-radius: var(--r-lg); padding: 18px; }
  .confirm p { margin: 0 0 14px; font-weight: 600; }
  .confirm .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .sheet-back { position: fixed; inset: 0; background: rgba(42, 31, 61, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; animation: fade .18s ease; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 460px; max-height: 82vh; overflow: auto;
    border: var(--borde); border-bottom: 0; border-radius: 24px 24px 0 0;
    padding: 14px max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    animation: up .22s ease;
  }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .3; margin: 0 auto 14px; }
  .sheet h2 { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; margin: 0 0 4px; }
  .day { font-weight: 800; font-size: 15px; margin: 18px 0 4px; }
  .ev { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1.5px solid #DDD6E8; font-weight: 600; }
  .ev time { color: var(--muted-on-white); font-variant-numeric: tabular-nums; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } }

  /* ——— Formularios ——— */
  .setup-kicker { font-weight: 700; margin: 14px 0 2px; }
  .setup-title { font-size: 40px; line-height: 1.02; margin: 0; }
  .intro { margin: 10px 0 0; }
  form { display: grid; gap: 22px; margin-top: 22px; }
  label.f, .f { display: grid; gap: 8px; font-weight: 800; font-size: 16px; }
  .f .hint { font-weight: 500; font-size: 14px; }
  input[type=text], input[type=url], input[type=tel], input[type=password], input[type=time], textarea, select {
    width: 100%; border: var(--borde); background: var(--surface); border-radius: var(--r-md);
    padding: 13px 16px; font-size: 17px; font-weight: 500; outline: none;
    transition: box-shadow .15s ease;
  }
  input::placeholder, textarea::placeholder { color: #8E84A0; }
  input:focus, textarea:focus, select:focus { box-shadow: 3px 4px 0 var(--ink); }
  textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
  .people { display: grid; gap: 8px; }
  .people .p-row { display: flex; gap: 8px; }
  .people .p-row input { flex: 1; min-width: 0; }
  .people .p-row button { width: 52px; flex: none; border: var(--borde); border-radius: var(--r-md); background: var(--surface); font-size: 22px; font-weight: 700; }
  .add-person { justify-self: start; }
  .horas .p-row input { font-weight: 700; font-size: 20px; padding: 10px 16px; }
  .horas .p-row input::-webkit-calendar-picker-indicator { opacity: .6; }
  .temas { display: flex; flex-wrap: wrap; gap: 8px; }
  .tema {
    width: 46px; height: 46px; border-radius: 14px; border: var(--borde); padding: 0;
    display: grid; place-items: center; transition: transform .08s ease, box-shadow .15s ease;
  }
  .tema span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); display: block; }
  .tema[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--ink); }
  .pin-input { letter-spacing: .6em; font-family: var(--legible); font-weight: 700; font-size: 26px !important; text-align: center; }
  .err { color: var(--danger); font-weight: 800; font-size: 15px; min-height: 1.4em; margin: 0; background: none; }
  .err:not(:empty) { background: var(--surface); border: 2px solid var(--danger); border-radius: 12px; padding: 8px 12px; }
  .form-actions { display: grid; gap: 12px; }
  .privacidad { margin: 4px 0 0; font-size: 14px; font-weight: 500; }

  /* ——— Estados generales ——— */
  .center { flex: 1; display: grid; place-items: center; text-align: center; }
  .center h2 { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 32px; margin: 0 0 8px; }
  .center p { margin: 0 auto 20px; max-width: 30ch; }
  .pulse { width: 120px; height: 120px; border-radius: 50%; background: var(--surface); border: var(--borde); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .brand { font-weight: 700; font-size: 15px; text-align: center; margin: 22px 0 0; }
  .brand a { text-decoration: none; }

  .demo-title { font-size: 52px; margin: 14px 0 8px; }
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 40px);
    background: var(--ink); color: #FFFFFF; padding: 12px 20px; border-radius: 999px; font-weight: 700;
    opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none; z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  dialog { border: var(--borde); border-radius: var(--r-lg); box-shadow: var(--sombra); padding: 22px; width: min(90vw, 360px); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(42, 31, 61, .45); }
  dialog h2 { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; margin: 0 0 6px; }
  dialog p { margin: 0; }
  dialog form { margin-top: 14px; gap: 12px; }
  dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

/* ══════════ ¿Ha comido? ══════════ */
/* Horas de comida. Cada comida «cubre» desde el punto medio con la anterior hasta el punto medio con la siguiente,
   así una comida dada un poco antes o después de su hora cuenta para esa comida y no se repite.
   Cada hora es el momento a partir del cual ya puede volver a comer: desde ahí sale «Le toca comer».
   La barra verde va desde la última comida hasta esa hora. */
const MAX_COMIDAS = 8;
const ADELANTO = 60; // una comida dada hasta 60 min antes de una hora cuenta ya para esa hora
const aMin = x => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(x || '')); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null; };
const hora = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
function horasPorDefecto(n) {
  n = Math.min(Math.max(Math.round(Number(n)) || 2, 1), MAX_COMIDAS);
  if (n === 1) return [9 * 60];
  if (n === 2) return [8 * 60, 20 * 60];
  if (n === 3) return [8 * 60, 14 * 60, 21 * 60];
  const ini = 8 * 60, fin = 21 * 60, out = [];
  for (let i = 0; i < n; i++) out.push(Math.round((ini + (fin - ini) * i / (n - 1)) / 15) * 15);
  return out;
}
function horasDe(cfg) {
  const hs = (Array.isArray(cfg.horas) ? cfg.horas : []).map(aMin).filter(x => x !== null);
  const u = [...new Set(hs)].sort((a, b) => a - b).slice(0, MAX_COMIDAS);
  return u.length ? u : horasPorDefecto(cfg.comidas);
}

  // T: las horas de comida de anteayer a pasado mañana, en orden
  const T = [], base = new Date(now); base.setHours(0, 0, 0, 0);
  for (let d = -2; d <= 2; d++) for (const m of horas) { const x = new Date(base); x.setDate(base.getDate() + d); x.setMinutes(m); T.push(x.getTime()); }
  T.sort((a, b) => a - b);
  // Una comida cuenta para la hora que ya ha empezado; si se da poco antes de la siguiente (hasta 1 h, o media distancia entre horas), cuenta para esa siguiente
  const margen = i => Math.min(ADELANTO * 60000, (T[i] - T[i - 1]) / 2);
  const desde = i => T[i] - margen(i), t0 = now.getTime();
  let k = 1; while (k + 1 < T.length - 1 && desde(k + 1) <= t0) k++;
  const ultima = i => { let f = 0; (eventos || []).forEach(e => { const x = new Date(e.fecha).getTime(); if (x >= desde(i) && x < desde(i + 1) && x > f) f = x; }); return f; };
  const dadaK = ultima(k);
  if (dadaK) return { fed: true, cuando: new Date(T[k + 1]), previa: new Date(dadaK) };
  if (t0 >= T[k]) return { fed: false, cuando: new Date(T[k]) };
  const dadaAnt = ultima(k - 1);   // aún no es la hora de la comida k
  if (dadaAnt) return { fed: true, cuando: new Date(T[k]), previa: new Date(dadaAnt) };
  return { fed: false, cuando: new Date(T[k - 1]) };   // se saltaron la anterior: puede comer desde entonces
}
function cuandoTexto(d, now) {
  if (sameDay(d, now)) return t('atTime', { t: hm(d) });
  const m = new Date(now); m.setDate(now.getDate() + 1);
  return sameDay(d, m) ? t('tomorrowAt', { t: hm(d) }) : t('atTime', { t: hm(d) });
}
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

  if (sameDay(d, now) && min < 6 * 60) return t('ago_h', { n: Math.round(min / 60) });
  if (sameDay(d, now)) return t('at', { t: hm(d) });
  const y = new Date(now); y.setDate(now.getDate() - 1);

}

  const detalle = !last ? t('never') : t(fed ? 'fedBy' : 'lastShort', { name: last.persona, when: ago(last.fecha) });
  const falta = est.cuando - now;
  const cuandoToca = t('canEatSince', { t: hm(est.cuando) });
  const tarjeta = fed
    ? h('section', { class: 'card status' },
        h('h2', { class: 'titular status-title' }, t('fed')),
        h('p', { class: 'status-detail' }, detalle),
        h('div', { class: 'barra', role: 'progressbar', 'aria-label': t('barLabel'), 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(pct)) },
          h('div', { class: 'barra-fill' + (pct >= 99.5 ? ' lleno' : ''), style: 'width:' + pct.toFixed(1) + '%' })),
        h('div', { class: 'barra-txt' }, h('span', { class: 'falta' }, faltaTexto(falta)), h('span', null, horaCorta(est.cuando, now))))
    : h('section', { class: 'card status aviso' + (cfg.tema === 'verde' ? ' sobre-verde' : ''), role: 'status' },
        h('h2', { class: 'titular status-title' }, t('hungry')),
        h('p', { class: 'status-cuando' }, cuandoToca),
        h('p', { class: 'status-detail' }, detalle));
  const screen = h('div', { class: 'screen state-' + (fed ? 'fed' : 'hungry') },
    h('div', { class: 'top' }, h('span', { class: 'top-label' }, t('petLabel')), gearBtn()),
    h('h1', { class: 'pegatina pet-name', style: 'font-size:' + tamNombre(cfg.mascota) + 'px' }, cfg.mascota),
    h('div', { class: 'bol' + (justFed ? ' pop' : ''), role: 'img', 'aria-label': fed ? t('bowlFull') : t('bowlEmpty'), html: bolSvg(tema.bol, fed) }),
    tarjeta,
    actions,
    h('div', { class: 'foot' },
      h('button', { class: 'link', onclick: openHistory }, t('history')),
      h('span', { class: 'foot-me' }, t('iam', { name: me }) + '. ', h('button', { class: 'link', onclick: () => { setMe(null); renderPet(); } }, t('change')))));
  mount(screen, brand());
  ajustarNombre(screen.querySelector('.pet-name'));
  justFed = false;
  // cada minuto se actualizan la barra y el estado (si no hay nada abierto encima)
  // cada 30 s avanzan la barra y el tiempo que falta; si cambia el estado, se repinta la pantalla
  clearInterval(petTimer);
  petTimer = setInterval(() => {
    if (!S || S.tipo !== 'P' || !$app.querySelector('.pet-name')) return clearInterval(petTimer);
    const ahora = new Date(), e = estadoComida(ahora, horasDe(S.config), S.eventos);
    if (e.fed !== fed || +e.cuando !== +est.cuando) {
      const abierto = document.querySelector('.sheet-back, .confirm') || document.getElementById('pinDlg').open;
      if (!abierto) renderPet();
      return;
    }
    if (!fed) return;
    const p = Math.max(0, Math.min(100, (ahora - e.previa) / (e.cuando - e.previa) * 100));
    const barra = $app.querySelector('.barra'), relleno = $app.querySelector('.barra-fill'), txt = $app.querySelector('.barra-txt .falta');
    if (relleno) { relleno.style.width = p.toFixed(1) + '%'; relleno.classList.toggle('lleno', p >= 99.5); }
    if (barra) barra.setAttribute('aria-valuenow', String(Math.round(p)));
    if (txt) txt.textContent = faltaTexto(e.cuando - ahora);
    const det = $app.querySelector('.status-detail'), ult = S.eventos && S.eventos[0];
    if (det && ult) det.textContent = t('fedBy', { name: ult.persona, when: ago(ult.fecha) });
  }, 30000);
}
let justFed = false;

function renderWho() {
  ponerSuelo(temaDe(S.config).suelo);
  mount(h('div', { class: 'screen state-hungry' },
    h('div', { class: 'top' }, h('span', { class: 'top-label' }, t('petLabel')), gearBtn()),
    h('h1', { class: 'pegatina who-title' }, t('whoTitle')),
    h('p', { class: 'intro', style: 'margin:0;font-weight:600' }, t('whoBody')),
    h('div', { class: 'who-list' }, S.config.personas.map(p =>
      h('button', { onclick: () => { setMe(p); renderPet(); } }, h('span', null, p), h('span', { html: ICON.chev }))))
  ), brand());
}

function askAgain(container, last) {
  container.replaceChildren(h('div', { class: 'confirm' },
    h('p', null, t('feedAgainQ', { pet: S.config.mascota, when: ago(last.fecha) })),
    h('div', { class: 'row' },
      h('button', { class: 'btn sec small', onclick: renderPet }, t('cancel')),
      h('button', { class: 'btn small', onclick: () => feed() }, t('feedAgainYes')))));
}

async function feed() {
  const btns = $app.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  try {
    const r = await api('comer', { persona: getMe() });
    if (!r.ok) throw 0;
    S.eventos = r.eventos; lastMine = r.eventos[0] && r.eventos[0].fecha; justFed = true;
    if (navigator.vibrate) navigator.vibrate(30);
    renderPet(); toast(t('fedToast'));
  } catch (_) { btns.forEach(b => b.disabled = false); toast(t('errNet')); }
}

async function undo() {
  try {
    const r = await api('deshacer');
    if (!r.ok) throw 0;
    S.eventos = r.eventos; lastMine = null; renderPet(); toast(t('undone'));
  } catch (_) { toast(t('errNet')); }
}

function openHistory() {
  const list = h('div');
  const evs = S.eventos || [];
  if (!evs.length) list.append(h('p', { class: 'muted' }, t('never')));
  let curDay = '';
  const now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  evs.forEach(ev => {
    const d = new Date(ev.fecha);
    const label = sameDay(d, now) ? t('today') : sameDay(d, y) ? t('yest') : d.toLocaleDateString(LANG, { weekday: 'long', day: 'numeric', month: 'long' });
    if (label !== curDay) { curDay = label; list.append(h('div', { class: 'day' }, label.charAt(0).toUpperCase() + label.slice(1))); }
    list.append(h('div', { class: 'ev' }, h('span', null, ev.persona), h('time', { datetime: ev.fecha }, hm(d))));
  });
  const back = h('div', { class: 'sheet-back', onclick: e => { if (e.target === back) back.remove(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-label': t('historyTitle') },
      h('div', { class: 'grab' }), h('h2', null, t('historyTitle')), list,
      h('button', { class: 'btn sec small', style: 'margin-top:18px', onclick: () => back.remove() }, t('close'))));
  document.body.append(back);
}

/* ══════════ Configuración (primera vez y ajustes) ══════════ */
let PIN_OK = null;
function openSettings() {
  const dlg = document.getElementById('pinDlg');
  document.getElementById('pinTitle').textContent = t('pinTitle');
  document.getElementById('pinHelp').textContent = t('pinHelp');
  document.getElementById('pinCancel').textContent = t('cancel');
  document.getElementById('pinOk').textContent = t('enter');
  const inp = document.getElementById('pinInput'), err = document.getElementById('pinErr');
  inp.value = ''; err.textContent = '';
  dlg.showModal(); setTimeout(() => inp.focus(), 50);
  document.getElementById('pinCancel').onclick = () => dlg.close();
  document.getElementById('pinForm').onsubmit = async e => {
    e.preventDefault();
    if (!/^\d{4}$/.test(inp.value)) { err.textContent = t('pinFormat'); return; }
    try {
      const r = await api('pin', { pin: inp.value });
      if (!r.ok) { err.textContent = t('pinWrong'); inp.select(); return; }
      PIN_OK = inp.value; dlg.close(); renderSetup(true);
    } catch (_) { err.textContent = t('errNet'); }
  };
}

function field(label, input, hint) { return h('label', { class: 'f' }, label, input, hint ? h('span', { class: 'hint' }, hint) : null); }

function renderSetup(isEdit) {
  const c = (isEdit && S.config) || {};
  const form = h('form', { novalidate: true });
  const err = h('p', { class: 'err', role: 'alert' });
  let collect;

  if (S.tipo === 'P') {
    const pet = h('input', { type: 'text', maxlength: 30, required: true, autocomplete: 'off', value: c.mascota || '' });
    const people = h('div', { class: 'people' });
    const addRow = (v = '') => {
      const inp = h('input', { type: 'text', maxlength: 20, placeholder: t('personPh'), autocomplete: 'off', value: v });
      const row = h('div', { class: 'p-row' }, inp, h('button', { type: 'button', 'aria-label': 'Quitar', title: 'Quitar', onclick: () => { if (people.children.length > 1) row.remove(); else inp.value = ''; } }, '×'));
      people.append(row); return inp;
    };
    (c.personas && c.personas.length ? c.personas : ['', '']).forEach(v => addRow(v));
    const horasBox = h('div', { class: 'people horas' });
    const addMealBtn = h('button', { type: 'button', class: 'link add-person', onclick: () => { const i = addHora(); if (i) i.focus(); } }, '+ ' + t('addMeal'));
    const actualizar = () => { addMealBtn.hidden = horasBox.children.length >= MAX_COMIDAS; };
    const valores = () => [...horasBox.querySelectorAll('input')].map(i => aMin(i.value)).filter(x => x !== null);
    const addHora = v => {
      if (horasBox.children.length >= MAX_COMIDAS) return null;
      if (v === undefined) {   // propone una hora de día: en medio del mayor hueco entre comidas
        const hs = [...new Set(valores())].sort((a, b) => a - b);
        if (!hs.length) v = 9 * 60;
        else if (hs.length === 1) v = hs[0] + 360 <= 22 * 60 ? hs[0] + 360 : Math.max(hs[0] - 360, 7 * 60);
        else { let mejor = -1;
          for (let i = 1; i < hs.length; i++) if (hs[i] - hs[i - 1] > mejor) { mejor = hs[i] - hs[i - 1]; v = Math.round((hs[i - 1] + mejor / 2) / 15) * 15; } }
      }
      const inp = h('input', { type: 'time', step: 300, required: true, value: typeof v === 'number' ? hora(v) : v });
      const row = h('div', { class: 'p-row' }, inp, h('button', { type: 'button', 'aria-label': t('removeMeal'), title: t('removeMeal'), onclick: () => { if (horasBox.children.length > 1) { row.remove(); actualizar(); } } }, '×'));
      const despues = [...horasBox.children].find(r => (aMin(r.querySelector('input').value) ?? 1e9) > aMin(inp.value));
      horasBox.insertBefore(row, despues || null); actualizar(); return inp;
    };
    horasDe(c).forEach(m => addHora(m));
    let tema = TEMAS[c.tema] ? c.tema : 'lila';
    const temas = h('div', { class: 'temas', role: 'group', 'aria-label': t('colorLabel') });
    const pintarTemas = () => { temas.querySelectorAll('.tema').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === tema))); ponerSuelo(TEMAS[tema].suelo); };
    Object.entries(TEMAS).forEach(([k, v]) => temas.append(h('button', { type: 'button', class: 'tema', 'data-t': k, 'aria-label': t('tema_' + k), title: t('tema_' + k), style: 'background:' + v.suelo, onclick: () => { tema = k; pintarTemas(); } },
      h('span', { style: 'background:' + v.bol }))));
    pintarTemas();
    form.append(
      field(t('petName'), pet),
      h('div', { class: 'f' }, h('span', null, t('people')), people,
        h('button', { type: 'button', class: 'link add-person', onclick: () => { if (people.children.length < 8) addRow().focus(); } }, '+ ' + t('addPerson')),
        h('span', { class: 'hint' }, t('peopleHint'))),
      h('div', { class: 'f' }, h('span', null, t('meals')), horasBox, addMealBtn, h('span', { class: 'hint' }, t('mealsHint'))),
      h('div', { class: 'f' }, h('span', null, t('colorLabel')), temas, h('span', { class: 'hint' }, t('colorHint')))
    );
    collect = () => ({ mascota: pet.value.trim(), personas: [...people.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean), horas: [...new Set(valores())].sort((a, b) => a - b).map(hora), tema });
  }

  const pin = h('input', { class: 'pin-input', type: 'password', inputmode: 'numeric', maxlength: 4, autocomplete: 'off' });
  form.append(isEdit ? field(t('pinChange'), pin, t('pinChangeHint')) : field(t('pinNew'), pin, t('pinNewHint')));
  const submit = h('button', { class: 'btn', type: 'submit' }, isEdit ? t('save') : t('saveStart'));
  form.append(err, h('div', { class: 'form-actions' }, submit, isEdit ? h('button', { type: 'button', class: 'btn sec', onclick: render }, t('cancel')) : null),
    h('p', { class: 'privacidad' }, t('privacy')));

  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    const cfg = collect();
    if (S.tipo === 'P' && (!cfg.mascota || !cfg.personas.length)) { err.textContent = t('dataErr'); return; }
    if (S.tipo === 'P' && !cfg.horas.length) { err.textContent = t('mealsErr'); return; }
    if (pin.value && !/^\d{4}$/.test(pin.value)) { err.textContent = t('pinFormat'); return; }
    if (!isEdit && !pin.value) { err.textContent = t('pinFormat'); return; }
    submit.disabled = true; submit.textContent = t('saving');
    try {
      const r = await api('configurar', { config: cfg, pinNuevo: pin.value || undefined, pinActual: PIN_OK || undefined });
      if (!r.ok) throw r.error;
      S = r; PIN_OK = null; render(); toast(t('saved'));
    } catch (code) {
      submit.disabled = false; submit.textContent = isEdit ? t('save') : t('saveStart');
      err.textContent = code === 'pin_formato' ? t('pinFormat') : code === 'datos' ? t('dataErr') : code === 'pin' ? t('pinWrong') : t('errNet');
    }
  });

  const titleKey = 'pSetupTitle', introKey = 'pSetupIntro', kicker = t('petLabel');
  mount(h('div', { class: 'screen' },
    h('p', { class: 'setup-kicker' }, kicker),
    h('h1', { class: 'pegatina setup-title' }, isEdit ? t('settings') : t(titleKey)),
    isEdit ? null : h('p', { class: 'intro' }, t(introKey)),
    form), brand());
}

cargar();
</script>
</body>
</html>
